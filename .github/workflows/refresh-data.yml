name: Refresh CFBD data
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (blank = current football season; Jan/Feb use prior year)'
        required: false
        type: string
  schedule:
    # UTC: daily baseline at 08:17.
    - cron: '17 8 * * *'
    # UTC extra windows Thu/Fri/Sat at 14:17, 20:17, 23:17.
    # Includes January postseason and August–December. At most 4/day.
    - cron: '17 14,20,23 * 1,8-12 4,5,6'
permissions:
  contents: read
concurrency:
  group: cfbd-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate code against fixtures before using secret
        run: npm test
      - name: Fetch, validate, and stage complete snapshot
        run: npm run data:refresh
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          DATA_SEASON: ${{ inputs.season || vars.DATA_SEASON }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - run: npm run data:validate
      - run: npm run build
      - name: Commit only changed public data
        id: commit
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add -- public/data
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh validated CFBD snapshot'
          # No force push or automatic conflict resolution: concurrent user edits win.
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    # GITHUB_TOKEN pushes do not trigger push workflows; call deployment explicitly.
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit }}
